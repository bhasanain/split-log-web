<!doctype html>
<html lang="en">
<head>
<title>Split Log</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout concept: dark, warm-black phone app. Soft rounded cards, a red glow at the top,
   a week strip of squares (red = trained, dashed = coming up), outlined pill actions,
   floating tab bar. One committed dark look, so no light theme. */
:root {
  --bg: #0A0909;
  --surface: #161313;
  --surface2: #201C1C;
  --line: #2C2626;
  --ink: #F4EFE6;
  --muted: #8F8983;
  --red: #A92B2B;
  --red-text: #EE4A43;
  --yellow: #F2D14B;
  --on-yellow: #17130A;
  --f: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sat: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --sar: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
  --sab: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --sal: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(110% 36% at 82% -4%, #3A0F10 0%, rgba(58, 15, 16, 0) 72%);
  background-repeat: no-repeat;
  color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, var(--sal)); padding-right: max(16px, var(--sar));
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; }
main { padding: calc(18px + var(--sat)) 0 124px; display: flex; flex-direction: column; gap: 14px; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 4px 0 4px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--red-text); }
.head h1 { font-size: 34px; font-weight: 600; line-height: 1.1; margin-top: 4px; letter-spacing: -.01em; }
.status { font-size: 12px; color: var(--muted); text-align: right; padding-top: 4px; max-width: 40%; }

.sec { display: flex; align-items: center; gap: 10px; margin: 10px 0 -4px; font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.sec::before { content: ""; width: 3px; height: 16px; border-radius: 2px; background: var(--red-text); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.card h2.big { font-size: 34px; line-height: 1.1; }
.muted { color: var(--muted); font-size: 15px; }
.small { font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.pillbtn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 60px; border-radius: 999px; background: transparent; border: 1.5px solid #3D3535; color: var(--ink); font-size: 18px; font-weight: 500; padding: 0 20px; }
.pillbtn svg { width: 26px; height: 26px; stroke: var(--ink); fill: none; stroke-width: 1.6; flex: none; }
.pillbtn.solid { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); font-weight: 600; }
.pillbtn.solid svg { stroke: var(--on-yellow); }
.pillbtn.sm { min-height: 44px; font-size: 15px; width: auto; padding: 0 18px; }
.link { background: none; border: 0; padding: 6px 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.logged { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 60px; border-radius: 999px; background: var(--red); padding: 0 20px; font-weight: 600; }
.logged .link { color: var(--ink); opacity: .9; }

.arrow { width: 44px; height: 44px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.arrow svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; }
.arrow:disabled { opacity: .35; }

.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.L { font-size: 13px; color: var(--muted); font-weight: 500; }
.L.now { color: var(--ink); font-weight: 700; }
.sq { width: 100%; aspect-ratio: 1 / 1.12; border-radius: 14px; border: 1.5px solid transparent; background: var(--surface2); display: grid; place-items: center; padding: 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.sq.done { background: var(--red); color: #fff; }
.sq.done.rc { background: transparent; border-color: var(--red); color: var(--red-text); }
.sq.future { background: transparent; border: 1.5px dashed #4A4141; }
.sq.rest { background: transparent; border: 1.5px dashed #332D2D; color: #5C5651; }
.sq.sel { border: 2px solid var(--ink); }
.sq.future.sel, .sq.rest.sel { border-style: solid; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px 14px; }
.tile b { display: block; font-size: 34px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }
.tiles.two { grid-template-columns: repeat(2, 1fr); }

.nudge { background: var(--surface); border: 1.5px dashed #5A4F4F; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.nudge p { font-size: 15px; }
.viewing { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.chip { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; border: 1.5px solid #3D3535; color: var(--muted); white-space: nowrap; }
.chip.done { background: var(--red); border-color: var(--red); color: #fff; }
.chip.today { border-color: var(--ink); color: var(--ink); }
.chip.missed { border-style: dashed; }

.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.ex-head { width: 100%; display: grid; grid-template-columns: 30px 1fr auto 14px; align-items: center; gap: 10px; background: none; border: 0; text-align: left; padding: 14px 18px; min-height: 66px; }
.ex-n { font-size: 22px; font-weight: 700; color: var(--red-text); }
.ex-t b { display: block; font-weight: 600; font-size: 16px; line-height: 1.2; }
.ex-t small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.ex-p { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.ex-p.full { color: var(--red-text); }
.chev { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform .15s; }
[aria-expanded="true"] > .chev { transform: rotate(180deg); }
.ex-body { padding: 0 18px 16px; display: none; flex-direction: column; gap: 8px; }
.ex-head[aria-expanded="true"] + .ex-body { display: flex; }
.set-h, .set { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 8px; align-items: center; }
.set-h { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.set label { font-size: 20px; font-weight: 700; color: var(--muted); }
input[type="text"], input[type="date"], input[type="time"] {
  width: 100%; min-width: 0; height: 48px; background: #0F0D0D; border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; font-size: 18px; font-variant-numeric: tabular-nums;
}
input::placeholder { color: #6A645F; }
input[type="file"] { font-size: 14px; color: var(--muted); }
input:disabled { opacity: .5; }
.ex-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.last { font-size: 13px; color: var(--muted); }
.vids { display: flex; flex-wrap: wrap; gap: 0 18px; }
.vid { color: var(--ink); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 8px 0; }

.split { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.split-head { width: 100%; display: grid; grid-template-columns: 52px 1fr auto 14px; align-items: center; gap: 12px; background: none; border: 0; text-align: left; padding: 14px 18px; min-height: 68px; }
.split-head.static { grid-template-columns: 52px 1fr auto; cursor: default; }
.split .d { font-size: 15px; font-weight: 700; letter-spacing: .08em; color: var(--red-text); text-transform: uppercase; }
.split .t b { display: block; font-weight: 600; font-size: 17px; }
.split .t small { color: var(--muted); font-size: 13px; }
.split-body { padding: 0 18px 16px; display: none; flex-direction: column; gap: 10px; }
.split-head[aria-expanded="true"] + .split-body { display: flex; }
.split-body ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.split-body li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.split-body li:first-child { border-top: 0; }
.split-body li span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .h { font-size: 12px; text-align: center; color: var(--muted); padding-bottom: 2px; }
.cell { aspect-ratio: 1; min-height: 40px; border-radius: 12px; border: 1.5px solid transparent; background: var(--surface2); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; padding: 0; font-variant-numeric: tabular-nums; color: var(--muted); }
.cell .n { font-size: 15px; font-weight: 600; }
.cell .c { font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.cell.blank { background: none; border: 0; }
.cell.off { background: none; }
.cell.done { background: var(--red); color: #fff; }
.cell.done.rc { background: transparent; border-color: var(--red); color: var(--red-text); }
.cell.missed { background: var(--surface2); }
.cell.today { border: 2px solid var(--ink); }
.legend { font-size: 13px; color: var(--muted); }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.err { color: var(--red-text); font-size: 14px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--f); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--red-text); }
.entries { display: flex; flex-direction: column; }
.entry { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.entry:first-child { border-top: 0; }

.rem { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.rem b { display: block; font-weight: 600; }
.rem small { color: var(--muted); font-size: 13px; }
a.add, button.add { background: transparent; display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #3D3535; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px; }
.timerow { display: grid; grid-template-columns: 1fr 156px; gap: 10px; align-items: center; }
.timerow input { height: 44px; font-size: 16px; }

.sw input { appearance: none; -webkit-appearance: none; width: 54px; height: 32px; border-radius: 999px; background: var(--surface2); border: 1px solid #3D3535; position: relative; margin: 0; flex: none; }
.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: left .15s, background .15s; }
.sw input:checked { background: var(--red); border-color: var(--red); }
.sw input:checked::after { left: 25px; background: #fff; }
.remn { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.remn:first-of-type { border-top: 0; }
.remn .row b { display: block; font-weight: 600; }
.remn .row small { color: var(--muted); font-size: 13px; }
textarea { width: 100%; background: #0F0D0D; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font: inherit; font-size: 16px; color: var(--ink); resize: vertical; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.seg button { border: 0; background: none; min-height: 42px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface2); color: var(--ink); }
.hmcard { text-align: left; width: 100%; color: inherit; font: inherit; }
.hm { display: grid; grid-template-columns: repeat(var(--w), 1fr); gap: 2px; width: 100%; }
.hm i { aspect-ratio: 1; border-radius: 2px; background: #1B1717; display: block; }
.hm i.done { background: var(--red); }
.hm i.rc { background: transparent; box-shadow: inset 0 0 0 1px var(--red); }
.hm i.missed { background: transparent; box-shadow: inset 0 0 0 1px #4A4141; }
.hm i.fut { background: #131010; }
.hm i.out { background: transparent; }
.hm i.now { box-shadow: 0 0 0 1.5px var(--ink); position: relative; }
.yms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.ym { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px; min-width: 0; }
.ym h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
.ym h3 span { color: var(--muted); letter-spacing: 0; }
.ycal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.yd { aspect-ratio: 1; border-radius: 4px; border: 0; background: #1B1717; padding: 0; min-height: 0; min-width: 0; }
.yd.blank { background: none; }
.yd.done { background: var(--red); }
.yd.done.rc { background: transparent; box-shadow: inset 0 0 0 1.5px var(--red); }
.yd.missed { background: transparent; box-shadow: inset 0 0 0 1px #4A4141; }
.yd.today { box-shadow: 0 0 0 1.5px var(--ink); }
.bar { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--red); border-radius: 4px; }
.bys { display: grid; grid-template-columns: 84px 1fr 32px; gap: 10px; align-items: center; font-size: 15px; }
.bys b { text-align: right; font-variant-numeric: tabular-nums; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 0; min-height: 52px; }
.srow:first-child { border-top: 0; }
.srow small { color: var(--muted); font-size: 13px; display: block; }
.srow b { font-weight: 600; }
nav#tabs {
  position: fixed; z-index: 20; left: max(14px, var(--sal)); right: max(14px, var(--sar)); bottom: calc(12px + var(--sab));
  max-width: 532px; margin: 0 auto; background: #151212; border: 1px solid var(--line); border-radius: 34px; padding: 6px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, .55);
}
nav#tabs button { background: none; border: 0; border-radius: 28px; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 13px; font-weight: 500; color: var(--muted); }
nav#tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav#tabs button[aria-current="page"] { color: var(--ink); background: var(--surface2); font-weight: 600; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + var(--sab)); background: var(--ink); color: #14110F; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 30; max-width: min(92vw, 440px); text-align: center; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
@media (max-width: 380px) { .head h1 { font-size: 30px; } .tile b { font-size: 28px; } .card { padding: 16px; } }
</style>

  <button data-tab="body"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>Body</button>

</nav>

<script>
(function () {
  'use strict';

  /* ---------- plan (from the V-taper PDF) ---------- */
  var ex = function (id, name, sets, reps, rest, o) { return Object.assign({ id: id, name: name, sets: sets, reps: reps, rest: rest }, o || {}); };
  var DAYS = {
    pull: { name: 'Pull A', code: 'PA', type: 'lift', minutes: 75, ex: [
      ex('pullup', 'Pull-ups', 4, '6-10', '2-3 min', { bw: 1 }),
      ex('csrow', 'Chest-supported row', 3, '8-12', '2 min'),
      ex('sapd', 'Straight-arm cable pulldown', 3, '12-15', '90 sec'),
      ex('rpd', 'Reverse pec deck', 3, '12-15', '60 sec'),
      ex('shrug', 'Dumbbell shrug', 3, '10-15', '90 sec'),
      ex('preacher', 'Preacher curl', 3, '8-12', '90 sec'),
      ex('hammer', 'Hammer curl', 3, '10-12', '60 sec'),
      ex('wristc', 'Seated wrist curl', 3, '12-15', '60 sec')] },
    push: { name: 'Push', code: 'PU', type: 'lift', minutes: 85, ex: [
      ex('lowinc', 'Low-incline press', 4, '6-10', '2-3 min'),
      ex('dips', 'Dips (lean forward)', 3, '8-12', '2 min', { bw: 1 }),
      ex('clr', 'Cable lateral raise', 4, '12-16 each', '60-90 sec'),
      ex('sdbp', 'Seated dumbbell shoulder press', 3, '8-10', '2 min'),

    window.location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(text);
  }
  function timeField(key, label, t) {
    return '<div class="timerow"><span>' + label + '</span><input type="time" data-time="' + key + '" value="' + t[key] + '" aria-label="' + label + ' time"></div>';
  }
  var REM_TYPES = [
    { k: 'work', title: 'Workout day', sub: 'Tells you which split day it is, on your 5 lifting days' },
    { k: 'check', title: 'Evening check-in', sub: "Asks if you logged today's workout, only if you have not" },
    { k: 'missed', title: 'Missed-day nudge', sub: 'Next morning, only if that workout is still not logged' },
    { k: 'recover', title: 'Thursday recovery', sub: 'Easy swim, sauna or steam' },
    { k: 'rest', title: 'Sunday rest day', sub: 'No lifting, sleep and food' },
    { k: 'summary', title: 'Sunday week review', sub: 'Reminds you to check your sessions and streak' }
  ];
  function remOn(k) { var s = S.docs.get('settings'); return !(s && s.on && s.on[k] === false); }
  function viewRemindNative() {
    var t = settings(), s = S.docs.get('settings') || {}, perm = S.perm || 'unknown';
    var h = '<header class="head"><div><div class="eyebrow">Alerts</div><h1>Reminders</h1></div><div class="status" id="status" aria-live="polite"></div></header>';
    var on = !!s.enabled && perm === 'granted';
    var msg = !s.enabled ? 'Reminders are off. Turn them on to get notifications on this phone, even when the app is closed.'
      : perm === 'granted' ? 'Reminders are on. They keep working when the app is closed. Open the app now and then so the next 3 weeks stay scheduled.'
      : 'Notifications are blocked for Split Log. Allow them in Android Settings, Apps, Split Log, Notifications.';
    h += '<section class="card"><p>' + msg + '</p>' + (on ? '<button class="pillbtn" data-action="testNotify">Send a test notification</button>' : '<button class="pillbtn solid" data-action="enableRem">Turn on reminders</button>') + '</section>';
    h += sec('Choose reminders') + '<section class="card">' + REM_TYPES.map(function (r) {
      var ck = remOn(r.k);
      return '<div class="remn"><div class="row"><div><b>' + r.title + '</b><small>' + r.sub + '</small></div><label class="sw"><input type="checkbox" data-on="' + r.k + '"' + (ck ? ' checked' : '') + ' aria-label="' + r.title + '"></label></div>' +
        (ck ? timeField(r.k, 'Time', t) : '') + '</div>';
    }).join('') + '</section>';
    h += '<p class="muted small">Android may delay a reminder by a few minutes to save battery. If you never get them, set Split Log to "Unrestricted" under Battery in Android Settings.</p>';
    return h;
  }
  function viewRemind() {
    if (NATIVE) return viewRemindNative();
    return viewRemindWeb();
  }
  function viewRemindWeb() {
    var t = settings(), cal = IOS;
    var h = '<header class="head"><div><div class="eyebrow">Alerts</div><h1>Reminders</h1></div><div class="status" id="status" aria-live="polite"></div></header>';
    if (cal) h += '<section class="card"><p>Websites can\'t send their own notifications on iPhone, so Calendar sends these. They arrive even when the app is closed, and each one repeats every week. Pick your times below, then add them.</p>' +
      '<button class="pillbtn solid" data-action="icsAll">Add all reminders to Calendar</button>' +
      '<p class="muted small">A share sheet opens. Choose Calendar, or tap Save to Files and open the saved file. Then tap Add All.</p></section>';
    else h += '<section class="card"><p>Your calendar app sends these, so they arrive even when this page is closed. Pick a time, tap Add, then save the event in Google Calendar. Each one repeats every week.</p></section>';
    h += sec('Workout day') + '<section class="card">' + timeField('work', 'Reminder time', t);
    [1, 2, 3, 5, 6].forEach(function (n) {
      var day = DAYS[DOW[n]];
      h += remRow(WDL[n] + ': ' + day.name, day.ex.length + ' exercises, about ' + day.minutes + ' min', cal ? null : gcal('Gym: ' + day.name, 'Open Split Log and check in after your workout.', [n], t.work), cal ? 'work-' + n : null);
    });
    h += '</section>' + sec('Check-in nudge') + '<section class="card">' + timeField('check', 'Time', t) +
      remRow("Did you log today's workout?", 'Mon, Tue, Wed, Fri, Sat', cal ? null : gcal("Log today's workout in Split Log", 'Missed days stay missed. Log it before bed.', LIFT_DOWS, t.check), cal ? 'check' : null) + '</section>';
    h += sec('Recovery and rest') + '<section class="card">' + timeField('recover', 'Thursday recovery', t) + timeField('rest', 'Sunday rest day', t) + timeField('summary', 'Sunday week review', t) +
      remRow('Thursday: recovery', 'Easy swim, sauna or steam', cal ? null : gcal('Recovery: easy swim, sauna or steam', 'No lifting today.', [4], t.recover), cal ? 'recover' : null) +
      remRow('Sunday: rest day', 'No lifting, sleep 7-9 hours', cal ? null : gcal('Rest day: no lifting', 'Sleep, eat well, easy walk if you like.', [0], t.rest), cal ? 'rest' : null) +
      remRow('Sunday: weekly summary', 'Open Daily and review the week', cal ? null : gcal('Review your gym week', 'Open Split Log. Sessions done out of 5, and your streak.', [0], t.summary), cal ? 'summary' : null) + '</section>';
    if (cal) h += '<p class="muted small">Each event alerts you at its start time. To change a time later, delete the old Split Log events in Calendar first, then add them again, so you don\'t get two. Calendar can\'t skip the check-in on days you already logged, so just ignore it then.</p>';
    else h += '<p class="muted small">Calendar reminders use your calendar\'s default alert time. Change it in Google Calendar settings if you want one at the exact start.</p>';
    return h;
  }

  /* ---------- render ---------- */
  function renderStatus() {
    var el = document.getElementById('status'); if (!el) return;
    el.textContent = S.mode === 'sync' ? (S.slow ? "Can't reach your account yet" : S.synced ? 'Saved to your account' : 'Syncing...') : 'Saved on this phone';
  }
  function render() {
    var v = document.getElementById('view');
    v.innerHTML = S.tab === 'today' ? viewDay() : S.tab === 'log' ? viewLog() : S.tab === 'body' ? viewBody() : viewRemind();
    document.querySelectorAll('#tabs button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'); });
    renderStatus();
    if (S.tab === 'log') {
      var btn = document.getElementById('exportBtn');
      if (btn && LOCAL) btn.hidden = false;
      else if (btn && use) use('downloads').then(function (dl) { if (dl && btn.isConnected) btn.hidden = false; }).catch(function () {});
    }
  }
  function renderSafe() {
    var a = document.activeElement;
    if (a && a.matches && a.matches('#view input')) { S.rerender = true; renderStatus(); return; }
    render();
  }
  var toastT;
  function toast(msg) {
    var el = document.getElementById('toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 3200);
  }

  /* ---------- actions ---------- */
  function ensureLog(date) {
    var id = 'log-' + date, l = S.docs.get(id);
    if (!l) { l = { kind: 'log', date: date, day: keyOf(date), done: false, sets: {} }; S.docs.set(id, l); }
    return l;
  }
  function findEx(date, exId) { return DAYS[keyOf(date)].ex.filter(function (e) { return e.id === exId; })[0]; }
  function num(v) { var n = parseFloat(String(v).trim().replace(',', '.')); return isNaN(n) ? null : n; }
  function openDay(date) { S.date = date; S.weekStart = mondayOf(date); S.tab = 'today'; render(); window.scrollTo(0, 0); }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    S.tab = b.dataset.tab;
    if (S.tab === 'today') { S.date = today(); S.weekStart = mondayOf(S.date); }
    render(); window.scrollTo(0, 0);
  });

  document.getElementById('view').addEventListener('click', function (e) {
    var a = e.target.closest('[data-action]'); if (!a) return;
    var act = a.dataset.action, tdy = today();
    if (act === 'toggle') { var id = a.dataset.id; if (S.expanded.has(id)) S.expanded.delete(id); else S.expanded.add(id); a.setAttribute('aria-expanded', S.expanded.has(id)); return; }
    if (act === 'splitToggle') { var k = a.dataset.key; if (S.splitOpen.has(k)) S.splitOpen.delete(k); else S.splitOpen.add(k); a.setAttribute('aria-expanded', S.splitOpen.has(k)); return; }
    if (act === 'done') { var l = ensureLog(S.date); l.done = true; l.day = keyOf(S.date); saveDoc('log-' + S.date, 60); render(); toast('Logged. Nice work.'); scheduleReminders(); return; }
    if (act === 'undo') { var l2 = logOf(S.date); if (l2) { l2.done = false; saveDoc('log-' + S.date, 60); } render(); scheduleReminders(); return; }
    if (act === 'pickDay') { S.date = a.dataset.date; render(); return; }
    if (act === 'goDay') { openDay(a.dataset.date); return; }
    if (act === 'goToday') { S.date = tdy; S.weekStart = mondayOf(tdy); render(); return; }
    if (act === 'weekPrev') { S.weekStart = addDays(S.weekStart, -7); render(); return; }
    if (act === 'weekNext') { S.weekStart = addDays(S.weekStart, 7); render(); return; }
    if (act === 'monthPrev') { S.month.m--; if (S.month.m < 0) { S.month.m = 11; S.month.y--; } render(); return; }
    if (act === 'monthNext') { S.month.m++; if (S.month.m > 11) { S.month.m = 0; S.month.y++; } render(); return; }
    if (act === 'sameLast') {
      var exd = findEx(S.date, a.dataset.id), last = lastFor(a.dataset.id, S.date); if (!exd || !last) return;
      var lg = ensureLog(S.date); lg.sets[exd.id] = clone(last).slice(0, exd.sets); saveDoc('log-' + S.date, 200); S.expanded.add(exd.id); render(); return;
    }
    if (act === 'saveBody') { saveBody(); return; }
    if (act === 'delBody') {
      var did = a.dataset.id;
      if (S.confirmDel === did) { S.docs.delete(did); S.confirmDel = null; saveDoc(did, 60); toast('Entry deleted.'); }
      else { S.confirmDel = did; setTimeout(function () { if (S.confirmDel === did) { S.confirmDel = null; if (S.tab === 'body') render(); } }, 3000); }
      render(); return;
    }
    if (act === 'exportCsv') { exportCsv(); return; }
    if (act === 'openYear') { S.histMode = 'year'; S.year = new Date().getFullYear(); S.tab = 'log'; render(); var hs = document.getElementById('hist'); if (hs) hs.scrollIntoView(); return; }
    if (act === 'histMode') { S.histMode = a.dataset.mode; render(); return; }
    if (act === 'yearPrev') { S.year--; render(); return; }
    if (act === 'yearNext') { S.year++; render(); return; }
    if (act === 'yearList') { S.yearList = !S.yearList; render(); return; }
    if (act === 'goAlerts') { S.tab = 'remind'; render(); window.scrollTo(0, 0); return; }
    if (act === 'enableRem') { enableReminders(); return; }
    if (act === 'testNotify') { testNotify(); return; }
    if (act === 'backup') { shareText('Split Log backup', backupJson(), 'Save your backup', 'split-log-backup.txt'); return; }
    if (act === 'backupCopy') { copyText(backupJson()); return; }
    if (act === 'hintOff') { S.hintOff = true; try { localStorage.setItem('splitlog.hint', '1'); } catch (e) {} render(); return; }
    if (act === 'icsAll') { addToCalendar(remEvents(), 'split-log-reminders.ics'); return; }
    if (act === 'ics') { var evs = remEvents().filter(function (e) { return e.id === a.dataset.ev; }); if (evs.length) addToCalendar(evs, 'split-log-' + a.dataset.ev + '.ics'); return; }
    if (act === 'restoreToggle') { S.restoreOpen = !S.restoreOpen; render(); return; }
    if (act === 'restoreDo') { restoreBackup(); return; }
  });

  document.getElementById('view').addEventListener('input', function (e) {
    var el = e.target; if (!el.dataset || !el.dataset.f) return;
    var exEl = el.closest('.ex'), row = el.closest('.set'); if (!exEl || !row) return;
    var date = S.date, exd = findEx(date, exEl.dataset.ex); if (!exd) return;
    var l = ensureLog(date), i = +row.dataset.i;
    var arr = l.sets[exd.id] || (l.sets[exd.id] = []);
    while (arr.length <= i) arr.push({ w: null, r: null });
    if (!arr[i]) arr[i] = { w: null, r: null };
    arr[i][el.dataset.f] = num(el.value);
    var n = exLogged(l, exd.id), p = exEl.querySelector('.ex-p');
    p.textContent = n + '/' + exd.sets; p.classList.toggle('full', n >= exd.sets);
    saveDoc('log-' + date, 700);
  });

  document.getElementById('view').addEventListener('change', function (e) {
    var el = e.target;
    if (el && el.id === 'r-file') {
      var f = el.files && el.files[0], box = document.getElementById('r-text');
      if (f && box) f.text().then(function (t) { box.value = t; toast('File loaded. Tap Restore.'); }).catch(function () { toast("Couldn't read that file."); });
      return;
    }
    if (!el.dataset) return;
    if (el.dataset.on) {
      var s0 = S.docs.get('settings') || { kind: 'settings', times: {} };
      s0.on = Object.assign({}, s0.on); s0.on[el.dataset.on] = el.checked;
      S.docs.set('settings', s0); saveDoc('settings', 300); render(); scheduleReminders(); return;
    }
    if (!el.dataset.time || !el.value) return;
    var s = S.docs.get('settings') || { kind: 'settings', times: {} };
    s.times = Object.assign({}, s.times); s.times[el.dataset.time] = el.value;
    S.docs.set('settings', s); saveDoc('settings', 300); render(); scheduleReminders();
  });

  document.getElementById('view').addEventListener('focusout', function () {
    setTimeout(function () {
      var a = document.activeElement;
      if (S.rerender && !(a && a.matches && a.matches('#view input'))) { S.rerender = false; render(); }
    }, 150);
  });

  function saveBody() {
    var date = document.getElementById('b-date').value || today();
    var w = num(document.getElementById('b-w').value), c = num(document.getElementById('b-c').value), err = '';
    if (w == null && c == null) err = 'Enter a weight, a waist measurement, or both.';
    else if (w != null && (w < 20 || w > 400)) err = 'Weight should be between 20 and 400 kg.';
    else if (c != null && (c < 30 || c > 250)) err = 'Waist should be between 30 and 250 cm.';
    S.bodyErr = err;
    if (err) { document.getElementById('b-err').textContent = err; return; }
    var id = 'body-' + date, old = S.docs.get(id) || {};
    S.docs.set(id, { kind: 'body', date: date, w: w != null ? w : (old.w != null ? old.w : null), c: c != null ? c : (old.c != null ? old.c : null) });
    saveDoc(id, 60); render(); toast('Entry saved.');
  }

  function exportCsv() {
    var q = function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; };
    var rows = ['date,split_day,exercise,set,weight_kg,reps_or_seconds'], logs = [];
    S.docs.forEach(function (d) { if (d.kind === 'log') logs.push(d); });
    logs.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    logs.forEach(function (l) {
      var day = DAYS[l.day || keyOf(l.date)], any = false;
      day.ex.forEach(function (e) {
        (l.sets && l.sets[e.id] || []).forEach(function (s, i) {
          if (s && (s.w != null || s.r != null)) { any = true; rows.push([l.date, q(day.name), q(e.name), i + 1, s.w != null ? s.w : '', s.r != null ? s.r : ''].join(',')); }
        });
      });
      if (!any && l.done) rows.push([l.date, q(day.name), '', '', '', ''].join(','));
    });
    if (!use) { shareText('Split Log CSV', rows.join('\n'), 'Share your logs', 'split-log.csv'); return; }
    use('downloads').then(function (dl) {
      if (!dl) throw 0;
      return dl.save({ filename: 'split-log.csv', data: rows.join('\n') });
    }).then(function () { toast('CSV saved.'); }).catch(function (err) { if (!err || err.code !== 'declined') toast("Couldn't save the file here."); });
  }

  /* ---------- reminders (Android local notifications) ---------- */
  function refreshPerm() {
    if (!LN) return Promise.resolve();
    return LN.checkPermissions().then(function (r) { S.perm = r.display; if (S.tab === 'remind' || S.tab === 'today') renderSafe(); }).catch(function () {});
  }
  function enableReminders() {
    if (!LN) return;
    LN.requestPermissions().then(function (r) {
      S.perm = r.display;
      if (r.display === 'granted') {
        var s = S.docs.get('settings') || { kind: 'settings', times: {} };
        s.enabled = true; S.docs.set('settings', s); saveDoc('settings', 60);
        scheduleReminders(); toast('Reminders are on.');
      } else toast('Allow notifications to use reminders.');
      render();
    }).catch(function () { toast("Couldn't ask for notification permission."); });
  }
  function testNotify() {
    if (!LN) return;
    LN.schedule({ notifications: [{ id: 999, title: 'Split Log', body: 'Reminders are working.', smallIcon: 'ic_stat_name', schedule: { at: new Date(Date.now() + 4000), allowWhileIdle: true } }] })
      .then(function () { toast('Test sent. It arrives in a few seconds.'); }).catch(function () { toast("Couldn't send the test."); });
  }
  function atTime(ds, hm) {
    var p = hm.split(':').map(Number), q = ds.split('-').map(Number);
    return new Date(q[0], q[1] - 1, q[2], p[0], p[1], 0);
  }
  function buildNotifications() {
    var t = settings(), now = Date.now(), out = [], tdy = today();
    function add(i, type, when, title, body) {
      if (when.getTime() <= now + 5000) return;
      out.push({ id: (i + 1) * 10 + type, title: title, body: body, smallIcon: 'ic_stat_name', schedule: { at: when, allowWhileIdle: true } });
    }
    for (var i = 0; i < 21; i++) {
      var d = addDays(tdy, i), key = keyOf(d), day = DAYS[key], lift = day.type === 'lift', done = isDone(d);
      if (lift && !done) {
        if (remOn('work')) add(i, 1, atTime(d, t.work), 'Gym today: ' + day.name, day.ex.length + ' exercises · ' + totalSets(day) + ' sets · about ' + day.minutes + ' min');
        if (remOn('check')) add(i, 2, atTime(d, t.check), "Did you log today's workout?", day.name + ' is not logged yet. Missed days stay missed.');
        if (remOn('missed')) add(i, 3, atTime(addDays(d, 1), t.missed), day.name + ' is not logged', "Yesterday's workout is missing. Log it now or it counts as missed.");
      }
      if (key === 'recovery' && !done && remOn('recover')) add(i, 4, atTime(d, t.recover), 'Recovery day', 'Easy swim, sauna or steam. No lifting today.');
      if (key === 'rest') {
        if (remOn('rest')) add(i, 5, atTime(d, t.rest), 'Rest day', 'No lifting today. Sleep 7-9 hours and eat well.');
        if (remOn('summary')) add(i, 6, atTime(d, t.summary), 'Review your week', 'Open Split Log to see your sessions and streak.');
      }
    }
    return out;
  }
  function runSchedule() {
    var s = S.docs.get('settings') || {};
    return LN.checkPermissions().then(function (p) {
      S.perm = p.display;
      return LN.getPending();
    }).then(function (pend) {
      var ids = (pend.notifications || []).filter(function (n) { return n.id !== 999; }).map(function (n) { return { id: n.id }; });
      return ids.length ? LN.cancel({ notifications: ids }) : null;
    }).then(function () {
      if (!s.enabled || S.perm !== 'granted') return null;
      var list = buildNotifications();
      return list.length ? LN.schedule({ notifications: list }) : null;
    }).catch(function () {});
  }
  var schedT, schedChain = Promise.resolve();
  function scheduleReminders() {
    if (!LN) return;
    clearTimeout(schedT);
    schedT = setTimeout(function () { schedChain = schedChain.then(runSchedule); }, 500);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var t = today(), rolled = S.lastDay !== t; S.lastDay = t;
    if (rolled) { S.date = t; S.weekStart = mondayOf(t); }
    if (NATIVE) { refreshPerm(); scheduleReminders(); render(); } else if (rolled) render();
  });
  if (!NATIVE && navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }

  /* ---------- backup and sharing ---------- */
  function backupJson() {
    var o = {}; S.docs.forEach(function (v, k) { o[k] = v; });
    return JSON.stringify({ app: 'split-log', v: 1, docs: o });
  }
  function copyText(text) {
    var p = (navigator.clipboard && navigator.clipboard.writeText) ? navigator.clipboard.writeText(text) : Promise.reject(new Error('no clipboard'));
    return p.then(function () { toast('Copied. Paste it into a note to keep it.'); })
      .catch(function () { toast("Couldn't share or copy it."); });
  }
  function webShare(filename, text, title) {
    var file = null;
    try { file = new File([text], filename, { type: 'text/plain' }); } catch (e) {}
    var fallback = function (e) { if (!e || e.name !== 'AbortError') return copyText(text); };
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: title }).catch(fallback);
    if (navigator.share && text.length < 100000) return navigator.share({ title: title, text: text }).catch(fallback);
    return copyText(text);
  }
  function shareText(title, text, dialog, filename) {
    if (SHARE && text.length < 200000) {
      return SHARE.share({ title: title, text: text, dialogTitle: dialog || title }).catch(function () {});
    }
    if (NATIVE) return copyText(text);
    return webShare(filename || 'split-log.txt', text, title);
  }
  function restoreBackup() {
    var el = document.getElementById('r-text'), raw = el ? el.value.trim() : '', o;
    try { o = JSON.parse(raw); } catch (e) { toast("That doesn't look like a Split Log backup."); return; }
    if (!o || o.app !== 'split-log' || !o.docs || typeof o.docs !== 'object') { toast("That doesn't look like a Split Log backup."); return; }
    var n = 0;
    Object.keys(o.docs).forEach(function (id) {
      var d = o.docs[id];
      if (!d || typeof d !== 'object' || ['log', 'body', 'settings'].indexOf(d.kind) < 0) return;
      if (!/^(log|body)-\d{4}-\d{2}-\d{2}$/.test(id) && id !== 'settings') return;
      S.docs.set(id, d); saveDoc(id, 60); n++;
    });
    S.restoreOpen = false; render(); scheduleReminders();
    toast(n ? 'Restored ' + n + ' entries.' : 'Nothing to restore in that backup.');
  }

  initStore();
  render();
})();
</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
